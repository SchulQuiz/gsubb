<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#ffffff">
<title>Eli · Der Plüschelefant</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link rel="stylesheet" href="./scene.css">
</head>
<body>
<main id="stage" aria-label="Plüschelefant Eli läuft ins Bild, spritzt die Scheibe nass, zwinkert und läuft wieder hinaus."></main>
<div id="loading" role="status">Ein kleiner Moment …</div>
<p id="error" hidden>Die 3D-Szene konnte nicht gestartet werden. Bitte öffne die Seite in einem aktuellen Browser mit aktiviertem WebGL.</p>
<div id="controls">
<button id="replay" type="button" aria-label="Szene erneut abspielen" title="Noch einmal">↻</button>
<button id="pause" type="button" aria-label="Animation pausieren" title="Pause">Ⅱ</button>
<button id="wipe" type="button" title="Scheibe trocknen">Scheibe trocknen</button>
</div>
<p class="sr-only" id="status" aria-live="polite"></p>
<noscript>Bitte aktiviere JavaScript, um den Elefanten zu sehen.</noscript>
<script src="./eli.bundle.js" defer></script>
</body>
</html>
